# 公共配置文件
spring:
  application:
    name: aigcoj-backend
  profiles:
    active: dev
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  # session 配置
  session:
    store-type: redis
    timeout: 2592000
  # 数据库配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/aigcoj_pro1?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: 123456
  # Redis 配置
  redis:
    database: 3
    host: localhost
    port: 6379
    timeout: 5000
    password: 123456
  # 文件上传
  servlet:
    multipart:
      max-file-size: 10MB
server:
  address: 0.0.0.0
  port: 8121
  servlet:
    context-path: /api
    session:
      cookie:
        max-age: 2592000
        same-site: lax
        secure: false
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: false
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: isDelete
      logic-delete-value: 1
      logic-not-delete-value: 0
codesandbox:
  # local：本地 JDK / Python 沙箱；ai：大模型模拟执行；remote：远程沙箱服务
  type: local
file:
  # 资料与头像上传目录
  upload-dir: ./data/uploads
ai:
  # 密钥优先级：环境变量 AI_DEEPSEEK_KEY > application-dev.yml（本地文件，不入库）> 空
  deepseek-key: ${AI_DEEPSEEK_KEY:}